name: Web Tests

on:
  push:
    branches: [custom/dev]
    paths:
      - "web/**"
      - ".github/workflows/web-tests.yml"
      # Phase 1 codegen — drift between BE WS protocol and FE types must
      # break this workflow even when web/ is untouched.
      - "deeptutor/core/stream.py"
      - "scripts/gen_ws_types.py"
      - "Makefile"
  pull_request:
    branches: [custom/dev]
    paths:
      - "web/**"
      - ".github/workflows/web-tests.yml"
      - "deeptutor/core/stream.py"
      - "scripts/gen_ws_types.py"
      - "Makefile"

# Cancel in-progress runs of the same ref so a fresh push superseded by a
# faster one doesn't burn CI minutes.
concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint / Type / Unit / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # Phase 1 — drift gate. Regenerates web/lib/ws-events.gen.ts from
      # deeptutor/core/stream.py and fails if the committed file is stale.
      # Stdlib-only; no `pip install` needed.
      - name: Verify FE↔BE WS types are in sync
        working-directory: ${{ github.workspace }}
        run: make types-check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (lib/) — node runner
        run: npm run test:node

      - name: Component tests — vitest + RTL
        run: npm run test:component

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm start &
          npx wait-on http://localhost:3000 -t 60000
        env:
          PORT: "3000"

      - name: Smoke tests (5 golden paths)
        run: npm run test:smoke
        env:
          WEB_BASE_URL: http://localhost:3000

      - name: Visual regression
        run: npm run test:visual
        env:
          WEB_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
